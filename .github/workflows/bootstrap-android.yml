name: Bootstrap NEXUS AI Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/nexusai/app/ui/theme
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NEXUS AI"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.3.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.4.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.parallel=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget

          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.nexusai.app"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.nexusai.app"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_17)
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2026.09.00"))
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">NEXUS AI</string>
              <string name="tab_dashboard">Home</string>
              <string name="tab_business">Business</string>
              <string name="tab_finance">Finance</string>
              <string name="tab_more">More</string>
              <string name="welcome">Welcome to NEXUS AI</string>
              <string name="dashboard_subtitle">Your intelligent business operating system</string>
              <string name="workspace_title">My Workspace</string>
              <string name="workspace_subtitle">Your business overview will appear here.</string>
              <string name="foundation_status">Project foundation is ready</string>
              <string name="foundation_description">Your NEXUS AI Android application is being prepared.</string>
          </resources>
          EOF

          cat > app/src/main/java/com/nexusai/app/MainActivity.kt <<'EOF'
          package com.nexusai.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.res.stringResource
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Home
          import androidx.compose.material.icons.filled.Business
          import androidx.compose.material.icons.filled.AccountBalanceWallet
          import androidx.compose.material.icons.filled.MoreHoriz
          import com.nexusai.app.ui.theme.NexusTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      NexusTheme {
                          NexusApp()
                      }
                  }
              }
          }

          private data class TabItem(
              val label: Int,
              val icon: ImageVector
          )

          @Composable
          fun NexusApp() {
              val tabs = listOf(
                  TabItem(R.string.tab_dashboard, Icons.Filled.Home),
                  TabItem(R.string.tab_business, Icons.Filled.Business),
                  TabItem(R.string.tab_finance, Icons.Filled.AccountBalanceWallet),
                  TabItem(R.string.tab_more, Icons.Filled.MoreHoriz)
              )

              var selectedTab by remember { mutableIntStateOf(0) }

              Scaffold(
                  bottomBar = {
                      NavigationBar {
                          tabs.forEachIndexed { index, item ->
                              NavigationBarItem(
                                  selected = selectedTab == index,
                                  onClick = { selectedTab = index },
                                  icon = {
                                      Icon(
                                          imageVector = item.icon,
                                          contentDescription = stringResource(item.label)
                                      )
                                  },
                                  label = {
                                      Text(stringResource(item.label))
                                  }
                              )
                          }
                      }
                  }
              ) { padding ->
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(padding)
                          .padding(20.dp)
                  ) {
                      when (selectedTab) {
                          0 -> DashboardScreen()
                          else -> PlaceholderScreen(
                              title = stringResource(tabs[selectedTab].label)
                          )
                      }
                  }
              }
          }

          @Composable
          private fun DashboardScreen() {
              Column(
                  verticalArrangement = Arrangement.spacedBy(18.dp)
              ) {
                  Text(
                      text = stringResource(R.string.welcome),
                      style = MaterialTheme.typography.headlineMedium
                  )

                  Text(
                      text = stringResource(R.string.dashboard_subtitle),
                      style = MaterialTheme.typography.bodyMedium,
                      color = MaterialTheme.colorScheme.onSurfaceVariant
                  )

                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(
                          containerColor = MaterialTheme.colorScheme.primaryContainer
                      )
                  ) {
                      Column(
                          modifier = Modifier.padding(20.dp),
                          verticalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          Text(
                              text = stringResource(R.string.workspace_title),
                              style = MaterialTheme.typography.titleLarge
                          )

                          Text(
                              text = stringResource(R.string.workspace_subtitle),
                              style = MaterialTheme.typography.bodyMedium
                          )
                      }
                  }

                  Card(
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Column(
                          modifier = Modifier.padding(20.dp),
                          verticalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          Text(
                              text = stringResource(R.string.foundation_status),
                              style = MaterialTheme.typography.titleMedium
                          )

                          Text(
                              text = stringResource(R.string.foundation_description),
                              style = MaterialTheme.typography.bodyMedium
                          )
                      }
                  }
              }
          }

          @Composable
          private fun PlaceholderScreen(title: String) {
              Box(
                  modifier = Modifier.fillMaxSize(),
                  contentAlignment = Alignment.Center
              ) {
                  Text(
                      text = title,
                      style = MaterialTheme.typography.headlineMedium
                  )
              }
          }
          EOF

          cat > app/src/main/java/com/nexusai/app/ui/theme/Theme.kt <<'EOF'
          package com.nexusai.app.ui.theme

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color

          private val NexusColors = lightColorScheme(
              primary = Color(0xFF087A50),
              onPrimary = Color.White,
              primaryContainer = Color(0xFFD4F5E5),
              onPrimaryContainer = Color(0xFF003824),
              secondary = Color(0xFF416A58),
              background = Color(0xFFF7F9F7),
              surface = Color.White
          )

          @Composable
          fun NexusTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = NexusColors,
                  content = content
              )
          }
          EOF

      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.gradle.kts build.gradle.kts gradle.properties app
          git commit -m "Bootstrap NEXUS AI Android project"
          git push

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7